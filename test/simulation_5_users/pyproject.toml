[project]
name = "five-user-demo"
version = "0.1.0"
description = "Exercicio mockado: 5 usuarios, 3 regimes de escalonamento (SPT, Slurm simulado, FCFS)"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
]

[tool.setuptools]
py-modules = ["schedulers", "five_user_demo"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
